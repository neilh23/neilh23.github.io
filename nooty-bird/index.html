<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nooty Bird</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1628;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: monospace;
    touch-action: manipulation;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    cursor: pointer;
  }
  #ui {
    position: fixed;
    top: 12px;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    color: #fff;
    text-shadow: 2px 2px 0 #000;
  }
  #score-display {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  #best-display {
    font-size: 14px;
    opacity: 0.7;
    margin-top: 2px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score-display">0</div>
  <div id="best-display">BEST: 0</div>
</div>
<script>
// ── Canvas setup ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 640;
canvas.width = W; canvas.height = H;

// Scale canvas to fit screen
function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ── Audio context (lazy init on first interaction) ────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playMunch() {
  try {
    const ac = getAudio();
    // Cute descending blip
    [0, 0.06, 0.12].forEach((t, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(880 - i * 120, ac.currentTime + t);
      osc.frequency.exponentialRampToValueAtTime(440 - i * 60, ac.currentTime + t + 0.06);
      gain.gain.setValueAtTime(0.18, ac.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.08);
      osc.start(ac.currentTime + t);
      osc.stop(ac.currentTime + t + 0.1);
    });
  } catch(e) {}
}

function playFlap() {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(500, ac.currentTime + 0.08);
    gain.gain.setValueAtTime(0.12, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + 0.15);
  } catch(e) {}
}

function playDead() {
  try {
    const ac = getAudio();
    [0, 0.1, 0.22].forEach((t, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300 - i * 60, ac.currentTime + t);
      osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime + t + 0.2);
      gain.gain.setValueAtTime(0.2, ac.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.22);
      osc.start(ac.currentTime + t);
      osc.stop(ac.currentTime + t + 0.25);
    });
  } catch(e) {}
}

// ── Game constants ────────────────────────────────────────────────────────────
const GRAVITY     = 0.42;
const FLAP_VEL    = -7.0;
const PIPE_SPEED  = 3.8;
const PIPE_GAP_MIN = 147; // min vertical gap between iceberg and rock
const PIPE_GAP_MAX = 210; // max vertical gap
const PIPE_INTERVAL_MIN = 55; // min frames between pipes
const PIPE_INTERVAL_MAX = 95; // max frames between pipes
const PENGUIN_X   = 90;
const PENGUIN_W   = 30;
const PENGUIN_H   = 34;

// ── Walk mode constants ───────────────────────────────────────────────────────
const GROUND_Y        = H - 80;    // ground level in walk mode
const WALK_GRAVITY    = 0.55;
const WALK_JUMP_VEL   = -10;
const WALK_SECTION_W  = 1800;      // total width of a land section
const SWIM_BEFORE_WALK = 700;      // swim frames before a walk section triggers

// ── Game state ────────────────────────────────────────────────────────────────
let state = 'idle'; // idle | playing | dead
let mode = 'swim';  // swim | transition_up | walk | transition_down
let penguin, pipes, fish, seals, squids, score, bestScore, frameCount, bgOffset, deathTimer;
let swimFrames, landSection, transTimer;
bestScore = 0;

function initGame() {
  penguin = { x: PENGUIN_X, y: H / 2, vy: 0, angle: 0, wobble: 0, onGround: false };
  pipes = [];
  fish = [];
  seals = [];
  squids = [];
  score = 0;
  frameCount = 0;
  bgOffset = 0;
  deathTimer = 0;
  nextPipeIn = 30;
  mode = 'swim';
  swimFrames = 0;
  landSection = null;
  transTimer = 0;
  document.getElementById('score-display').textContent = '0';
}

// ── Pipe/obstacle generation ──────────────────────────────────────────────────
const OBS_W = 70; // obstacle width

function makeSpikes(count) {
  const spikes = [];
  for (let i = 0; i < count; i++) {
    const sw = 6 + Math.random() * 14;
    // Clamp offset so spike base stays fully within obstacle width
    const margin = (sw / 2) / OBS_W;
    const rawOff = (i / count) + (Math.random() * 0.08 - 0.04);
    const offset = Math.max(margin, Math.min(1 - margin, rawOff));
    spikes.push({
      offset,
      width: sw,
      height: 12 + Math.random() * 35
    });
  }
  return spikes;
}

let nextPipeIn = 0; // frames until next pipe

function spawnPipe() {
  const gap = PIPE_GAP_MIN + Math.random() * (PIPE_GAP_MAX - PIPE_GAP_MIN);
  const minTop = 60, minBot = 60;
  const topH = minTop + Math.random() * (H - gap - minTop - minBot);
  const botY  = topH + gap;
  const x     = W + 20;

  pipes.push({
    x, topH, botY, botH: H - botY, gap, passed: false,
    iceSpikes: makeSpikes(4 + Math.floor(Math.random() * 4)),
    rockSpikes: makeSpikes(4 + Math.floor(Math.random() * 4))
  });

  // Fish: appears in the middle of the gap, 50% chance
  if (Math.random() < 0.5) {
    fish.push({
      x: x + 20,
      y: topH + gap / 2,
      eaten: false,
      anim: 0
    });
  }

  // Randomize next spawn interval
  nextPipeIn = PIPE_INTERVAL_MIN + Math.floor(Math.random() * (PIPE_INTERVAL_MAX - PIPE_INTERVAL_MIN));
}

const SEAL_W = 90;
const SEAL_H = 32;

function spawnSeal() {
  // Place seal at a random Y with margin from edges
  const margin = 80;
  const y = margin + Math.random() * (H - margin * 2 - SEAL_H);
  seals.push({ x: W + 20, y, anim: 0 });

  nextPipeIn = PIPE_INTERVAL_MIN + Math.floor(Math.random() * (PIPE_INTERVAL_MAX - PIPE_INTERVAL_MIN));
}

function spawnObstacle() {
  if (Math.random() < 0.2) {
    spawnSeal();
  } else {
    spawnPipe();
  }
}

// ── Walk section generation ───────────────────────────────────────────────────
function generateWalkSection() {
  const obs = [];
  let cx = 200; // start placing obstacles after a short run-up
  while (cx < WALK_SECTION_W - 300) {
    const roll = Math.random();
    if (roll < 0.3) {
      // Ice cube on ground (jump over)
      const w = 40 + Math.random() * 30;
      const h = 40 + Math.random() * 30;
      obs.push({ type: 'cube', x: cx, y: GROUND_Y - h, w, h });
      cx += w + 80 + Math.random() * 60;
    } else if (roll < 0.5) {
      // Tall ice cube stack (must jump on top of, or jump over gap after)
      const w = 50 + Math.random() * 20;
      const h = 70 + Math.random() * 40;
      obs.push({ type: 'cube', x: cx, y: GROUND_Y - h, w, h });
      cx += w + 100 + Math.random() * 80;
    } else if (roll < 0.7) {
      // Gap in the floor
      const gapW = 60 + Math.random() * 50;
      obs.push({ type: 'gap', x: cx, w: gapW });
      cx += gapW + 100 + Math.random() * 60;
    } else if (roll < 0.85) {
      // Snow mound (small bump to hop over)
      const w = 50 + Math.random() * 20;
      obs.push({ type: 'mound', x: cx, w, h: 25 + Math.random() * 15 });
      cx += w + 70 + Math.random() * 50;
    } else {
      // Elevated ice platform (floating cube to land on)
      const w = 60 + Math.random() * 40;
      obs.push({ type: 'cube', x: cx, y: GROUND_Y - 100 - Math.random() * 40, w, h: 24 });
      cx += w + 90 + Math.random() * 60;
    }
  }
  return {
    scrollX: 0,
    totalWidth: WALK_SECTION_W,
    obstacles: obs,
    // Fishing penguin NPC at the end
    npcX: WALK_SECTION_W - 140,
    holeX: WALK_SECTION_W - 100,
  };
}

// ── Pixel art drawing helpers ─────────────────────────────────────────────────
function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

// Draw pixelated penguin (swimming rightward)
function drawPenguin(x, y, angle, wobble) {
  ctx.save();
  ctx.translate(x + PENGUIN_W / 2, y + PENGUIN_H / 2);
  ctx.rotate(angle);

  const w = wobble;
  const S = 0.78; // scale factor

  // Body (elongated horizontal, black)
  px(-20*S, -12*S+w, 36*S, 24*S, '#1a1a2e');
  // Belly (white/cream, horizontal)
  px(-14*S, -6*S+w, 24*S, 14*S, '#e8e8d0');
  // Belly shine
  px(-6*S, -4*S+w, 8*S, 6*S, '#f0f0e0');
  // Head (right side, slightly forward)
  px(14*S, -14*S+w, 14*S, 18*S, '#1a1a2e');
  // Beak (pointing right)
  px(26*S, -6*S+w, 8*S, 4*S, '#ff8c00');
  // Eye (white)
  px(20*S, -10*S+w, 4*S, 4*S, '#ffffff');
  // Pupil
  px(22*S, -9*S+w, 2*S, 2*S, '#000');
  // Blush (pink, on cheek)
  px(16*S, -2*S+w, 4*S, 3*S, '#ffb3c6');
  // Tail (left side, small)
  px(-24*S, -6*S+w, 6*S, 8*S, '#0d0d1a');
  // Flippers (top and bottom, animating)
  const flipAngle = Math.sin(frameCount * 0.35) * 6;
  px(-8*S, -18*S+w + flipAngle, 14*S, 5*S, '#0d0d1a');
  px(-8*S, 12*S+w - flipAngle, 14*S, 5*S, '#0d0d1a');
  // Feet (tucked behind, visible underneath)
  px(-16*S, 10*S+w, 5*S, 4*S, '#ff8c00');
  px(-8*S,  12*S+w, 5*S, 3*S, '#ff8c00');

  ctx.restore();
}

// Draw walking penguin (upright, waddling)
function drawWalkPenguin(x, y, onGround) {
  ctx.save();
  ctx.translate(x + PENGUIN_W / 2, y + PENGUIN_H / 2);
  const S = 0.78;

  // Waddle animation (only when on ground)
  const waddle = onGround ? Math.sin(frameCount * 0.3) * 0.08 : 0;
  ctx.rotate(waddle);
  const footAnim = onGround ? Math.sin(frameCount * 0.3) * 3 : 0;

  // Body (upright, round)
  px(-12*S, -16*S, 24*S, 32*S, '#1a1a2e');
  // Belly
  px(-8*S, -10*S, 16*S, 22*S, '#e8e8d0');
  // Belly shine
  px(-3*S, -6*S, 6*S, 10*S, '#f0f0e0');
  // Head (on top)
  px(-10*S, -26*S, 20*S, 14*S, '#1a1a2e');
  // Beak (pointing right)
  px(8*S, -20*S, 8*S, 4*S, '#ff8c00');
  // Eye
  px(4*S, -24*S, 4*S, 4*S, '#ffffff');
  px(5*S, -23*S, 2*S, 2*S, '#000');
  // Blush
  px(0*S, -16*S, 4*S, 3*S, '#ffb3c6');
  // Flippers (arms at sides)
  const flapOff = onGround ? Math.sin(frameCount * 0.15) * 2 : -4;
  px(-16*S, -10*S + flapOff, 6*S, 16*S, '#0d0d1a');
  px(10*S, -10*S - flapOff, 6*S, 16*S, '#0d0d1a');
  // Feet (alternating waddle)
  px(-8*S + footAnim, 14*S, 7*S, 5*S, '#ff8c00');
  px(1*S - footAnim, 14*S, 7*S, 5*S, '#ff8c00');

  ctx.restore();
}

// Draw fishing penguin NPC
function drawFishingPenguin(x, y) {
  ctx.save();
  ctx.translate(x, y);
  const S = 0.8;

  // Body (sitting, facing the hole on the left)
  px(-10*S, -12*S, 22*S, 28*S, '#1a1a2e');
  // Belly
  px(-6*S, -6*S, 14*S, 20*S, '#e8e8d0');
  // Head
  px(-8*S, -22*S, 18*S, 14*S, '#1a1a2e');
  // Beak (facing left)
  px(-14*S, -16*S, 8*S, 4*S, '#ff8c00');
  // Eye
  px(-6*S, -20*S, 4*S, 4*S, '#ffffff');
  px(-5*S, -19*S, 2*S, 2*S, '#000');
  // Blush
  px(-8*S, -13*S, 4*S, 3*S, '#ffb3c6');
  // Hat (red beanie with bobble)
  px(-9*S, -28*S, 20*S, 8*S, '#cc3333');
  px(-6*S, -32*S, 14*S, 6*S, '#cc3333');
  px(-2*S, -36*S, 6*S, 5*S, '#cc3333');
  // Bobble
  px(0*S, -39*S, 4*S, 4*S, '#fff');
  // Hat brim stripe
  px(-9*S, -24*S, 20*S, 3*S, '#fff');
  // Flippers - one holding rod
  px(-14*S, -6*S, 6*S, 12*S, '#0d0d1a');
  px(10*S, -4*S, 6*S, 10*S, '#0d0d1a');
  // Feet
  px(-8*S, 14*S, 7*S, 4*S, '#ff8c00');
  px(2*S, 14*S, 7*S, 4*S, '#ff8c00');

  // Fishing rod (extends left over the hole)
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10*S, -6*S);
  ctx.lineTo(-60*S, -50*S);
  ctx.stroke();
  // Fishing line
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-60*S, -50*S);
  ctx.lineTo(-55*S, 20*S);
  ctx.stroke();
  // Hook
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-55*S, 20*S);
  ctx.arc(-55*S + 3, 20*S, 3, Math.PI, 0, true);
  ctx.stroke();

  ctx.restore();
}

// Draw iceberg (top obstacle) with pointy stalactite bottom
function drawIceberg(x, h, spikes) {
  const iw = 70;
  // Main ice body
  px(x, 0, iw, h - 10, '#a8d8ea');
  // Ice shading (darker edges)
  px(x, 0, 6, h - 10, '#7ec8e3');
  px(x + iw - 6, 0, 6, h - 10, '#7ec8e3');
  // Cracks / texture lines
  px(x + 15, 20, 3, Math.min(40, h - 30), '#90c8da');
  px(x + 40, 10, 2, Math.min(30, h - 20), '#90c8da');
  // Sparkle highlights
  px(x + 10, 12, 4, 4, '#ffffff');
  px(x + 50, 30, 3, 3, '#ffffff');
  // Pointy stalactite spikes hanging down
  if (spikes) {
    for (const s of spikes) {
      const sx = x + s.offset * iw;
      const sw = s.width;
      const sh = s.height;
      // Each spike is a triangle pointing down
      ctx.fillStyle = '#a8d8ea';
      ctx.beginPath();
      ctx.moveTo(sx - sw/2, h - 10);
      ctx.lineTo(sx + sw/2, h - 10);
      ctx.lineTo(sx, h - 10 + sh);
      ctx.closePath();
      ctx.fill();
      // Shading on right side of spike
      ctx.fillStyle = '#7ec8e3';
      ctx.beginPath();
      ctx.moveTo(sx, h - 10);
      ctx.lineTo(sx + sw/2, h - 10);
      ctx.lineTo(sx, h - 10 + sh);
      ctx.closePath();
      ctx.fill();
      // Tip highlight
      ctx.fillStyle = '#d0f0ff';
      ctx.beginPath();
      ctx.moveTo(sx - sw/4, h - 10);
      ctx.lineTo(sx, h - 10);
      ctx.lineTo(sx - 1, h - 10 + sh * 0.6);
      ctx.closePath();
      ctx.fill();
    }
  }
}

// Draw rock (bottom obstacle) with pointy stalagmite top
function drawRock(x, y, h, spikes) {
  const rw = 70;
  // Main rock body (below the spike zone)
  px(x, y + 10, rw, h - 10, '#6b6b6b');
  // Side shading
  px(x + rw - 8, y + 10, 8, h - 10, '#4a4a4a');
  // Highlights
  px(x + 8,  y + 30, 5, 5, '#999');
  px(x + 45, y + 45, 4, 4, '#888');
  // Barnacles / spots
  [12, 25, 38, 52].forEach(bx => px(x + bx, y + 10 + (h - 10) * 0.4, 4, 4, '#555'));
  // Pointy stalagmite spikes going up
  if (spikes) {
    for (const s of spikes) {
      const sx = x + s.offset * rw;
      const sw = s.width;
      const sh = s.height;
      // Each spike is a triangle pointing up
      ctx.fillStyle = '#6b6b6b';
      ctx.beginPath();
      ctx.moveTo(sx - sw/2, y + 10);
      ctx.lineTo(sx + sw/2, y + 10);
      ctx.lineTo(sx, y + 10 - sh);
      ctx.closePath();
      ctx.fill();
      // Shading on right side
      ctx.fillStyle = '#4a4a4a';
      ctx.beginPath();
      ctx.moveTo(sx, y + 10);
      ctx.lineTo(sx + sw/2, y + 10);
      ctx.lineTo(sx, y + 10 - sh);
      ctx.closePath();
      ctx.fill();
      // Highlight on left side
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.moveTo(sx - sw/4, y + 10);
      ctx.lineTo(sx, y + 10);
      ctx.lineTo(sx - 1, y + 10 - sh * 0.6);
      ctx.closePath();
      ctx.fill();
    }
  }
}

// Draw fish collectible
function drawFish(x, y, anim) {
  const bob = Math.sin(anim * 0.1) * 3;
  const fx = x - 14;
  const fy = y - 8 + bob;

  // Tail
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(fx, fy + 4);
  ctx.lineTo(fx - 8, fy);
  ctx.lineTo(fx - 8, fy + 8);
  ctx.closePath();
  ctx.fill();

  // Body
  px(fx, fy + 1, 20, 12, '#ffd700');
  // Belly
  px(fx + 2, fy + 5, 14, 6, '#fff176');
  // Eye
  px(fx + 14, fy + 2, 4, 4, '#fff');
  px(fx + 15, fy + 3, 2, 2, '#000');
  // Fin
  ctx.fillStyle = '#ffbf00';
  ctx.beginPath();
  ctx.moveTo(fx + 6,  fy + 1);
  ctx.lineTo(fx + 12, fy - 5);
  ctx.lineTo(fx + 14, fy + 1);
  ctx.closePath();
  ctx.fill();

  // Sparkle
  if ((anim % 20) < 10) {
    px(fx + 16, fy, 3, 3, '#ffffff');
  }
}

// Draw leopard seal (facing LEFT toward the penguin, rotated to angle)
function drawSeal(x, y, anim, angle) {
  ctx.save();
  ctx.translate(x + SEAL_W / 2, y + 14);
  ctx.rotate(angle || 0);

  const hw = SEAL_W / 2;

  // Body (long, sleek, dark grey with spots)
  px(-hw, -8, SEAL_W, 20, '#5a5a6a');
  // Belly (lighter)
  px(-hw + 12, 0, SEAL_W - 20, 10, '#8a8a9a');
  // Head (front LEFT, facing penguin)
  px(-hw, -12, 24, 22, '#5a5a6a');
  // Snout (pointing left)
  px(-hw - 6, -6, 10, 10, '#4a4a5a');
  // Jaw (open, menacing, left side)
  px(-hw - 8, 0, 10, 6, '#6a3030');
  // Teeth
  px(-hw - 2, -1, 2, 3, '#fff');
  px(-hw - 5, -1, 2, 3, '#fff');
  px(-hw - 2, 4, 2, 2, '#fff');
  // Eye (menacing)
  px(-hw + 11, -8, 5, 5, '#fff');
  px(-hw + 12, -7, 3, 3, '#200');
  // Pupil slit
  px(-hw + 12, -7, 1, 3, '#000');
  // Leopard spots (along body behind head)
  const spots = [28, 42, 56, 68, 78];
  spots.forEach(sx2 => {
    if (sx2 < SEAL_W) {
      px(-hw + sx2, -6, 5, 4, '#3a3a4a');
      px(-hw + sx2 - 3, 1, 4, 3, '#3a3a4a');
    }
  });
  // Tail (RIGHT side, forked)
  ctx.fillStyle = '#4a4a5a';
  ctx.beginPath();
  ctx.moveTo(hw - 4, -4);
  ctx.lineTo(hw + 12, -10);
  ctx.lineTo(hw + 6, -2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hw - 4, 4);
  ctx.lineTo(hw + 12, 10);
  ctx.lineTo(hw + 6, 2);
  ctx.closePath();
  ctx.fill();
  // Front flippers (near head, left side)
  const flipAnim = Math.sin(anim * 0.1) * 4;
  px(-hw + 18, 8 + flipAnim, 12, 6, '#4a4a5a');
  // Back flippers (near tail, right side)
  px(hw - 16, 8 - flipAnim, 10, 6, '#4a4a5a');

  ctx.restore();
}

// Draw squid (rising from bottom, collectible)
function drawSquid(x, y, anim) {
  const wobX = Math.sin(anim * 0.08) * 4;
  const sx = x + wobX;

  // Tentacles (8 wiggly legs hanging down)
  for (let i = 0; i < 8; i++) {
    const tx = sx - 10 + i * 3;
    const wave = Math.sin(anim * 0.12 + i * 0.8) * 4;
    ctx.fillStyle = (i % 2 === 0) ? '#c850c0' : '#a040a0';
    ctx.beginPath();
    ctx.moveTo(tx, y + 14);
    ctx.lineTo(tx + 2, y + 14);
    ctx.lineTo(tx + 1 + wave, y + 28);
    ctx.closePath();
    ctx.fill();
    // Suckers
    if (i % 2 === 0) {
      px(tx + wave * 0.5, y + 20, 2, 2, '#e080d0');
    }
  }

  // Body (bulbous head)
  px(sx - 10, y - 4, 22, 20, '#c850c0');
  // Head dome (top)
  px(sx - 8, y - 10, 18, 8, '#d060d0');
  px(sx - 5, y - 13, 12, 5, '#d870d8');
  // Belly shading
  px(sx - 6, y + 2, 14, 10, '#b040b0');
  // Eyes (big, cute)
  px(sx - 7, y, 6, 7, '#fff');
  px(sx + 3, y, 6, 7, '#fff');
  // Pupils
  px(sx - 6, y + 2, 3, 3, '#201040');
  px(sx + 4, y + 2, 3, 3, '#201040');
  // Sparkle in eyes
  px(sx - 5, y + 1, 2, 2, '#fff');
  px(sx + 5, y + 1, 2, 2, '#fff');

  // Glow effect (pulsing)
  const glowAlpha = 0.15 + Math.sin(anim * 0.1) * 0.1;
  ctx.fillStyle = `rgba(200, 80, 200, ${glowAlpha})`;
  ctx.beginPath();
  ctx.arc(sx + 1, y + 4, 20, 0, Math.PI * 2);
  ctx.fill();

  // Point value indicator
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('+15', sx + 1, y - 16);
}

// ── Background drawing ────────────────────────────────────────────────────────
function drawBackground(offset) {
  // Deep ocean gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0,   '#0a2a4a');
  grad.addColorStop(0.3, '#0d3b6e');
  grad.addColorStop(0.7, '#0a2a4a');
  grad.addColorStop(1,   '#071a30');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Bubbles
  ctx.fillStyle = 'rgba(100,180,255,0.15)';
  const bubbles = [
    {x: 40,  y: 100, r: 6},
    {x: 120, y: 200, r: 4},
    {x: 200, y: 350, r: 8},
    {x: 320, y: 150, r: 5},
    {x: 400, y: 280, r: 7},
    {x: 60,  y: 450, r: 3},
    {x: 260, y: 500, r: 5},
    {x: 440, y: 420, r: 6},
  ];
  bubbles.forEach(b => {
    const by = ((b.y - offset * 0.3) % H + H) % H;
    ctx.beginPath();
    ctx.arc(b.x, by, b.r, 0, Math.PI * 2);
    ctx.fill();
    // Shine
    ctx.fillStyle = 'rgba(200,240,255,0.3)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, by - b.r * 0.3, b.r * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(100,180,255,0.15)';
  });

  // Seaweed
  ctx.fillStyle = 'rgba(0,150,80,0.25)';
  [70, 180, 320, 430].forEach((sx, i) => {
    for (let seg = 0; seg < 5; seg++) {
      const wave = Math.sin((offset * 0.02 + i + seg) * 0.8) * 6;
      px(sx + wave, H - 40 - seg * 18, 8, 16, `rgba(0,${130 + seg * 8},${50 + seg * 5},0.25)`);
    }
  });
}

function drawLandObstacle(obs, offsetX) {
  const ox = obs.x - offsetX;
  if (ox < -100 || ox > W + 50) return;

  if (obs.type === 'cube') {
    // Ice cube
    px(ox, obs.y, obs.w, obs.h, '#a0d8ea');
    // Highlight top
    px(ox, obs.y, obs.w, 4, '#d0f0ff');
    // Shading right
    px(ox + obs.w - 5, obs.y, 5, obs.h, '#80c0d8');
    // Crack lines
    px(ox + obs.w * 0.3, obs.y + 8, 2, obs.h * 0.5, '#88c0d0');
    // Sparkle
    px(ox + 6, obs.y + 6, 3, 3, '#ffffff');
    px(ox + obs.w - 12, obs.y + obs.h * 0.4, 2, 2, '#fff');
  } else if (obs.type === 'gap') {
    // Draw gap in the ground (dark water below)
    px(ox, GROUND_Y, obs.w, H - GROUND_Y, '#0a2a4a');
    // Water surface
    px(ox, GROUND_Y + 4, obs.w, 6, '#1a5a8a');
    // Ripples
    for (let r = 0; r < obs.w - 8; r += 12) {
      const ry = Math.sin((frameCount * 0.08 + r) * 0.5) * 2;
      px(ox + 4 + r, GROUND_Y + 6 + ry, 8, 2, '#2a7aba');
    }
    // Edge cracks
    px(ox - 2, GROUND_Y, 4, 12, '#90c8d8');
    px(ox + obs.w - 2, GROUND_Y, 4, 12, '#90c8d8');
  } else if (obs.type === 'mound') {
    // Snow mound (triangle)
    ctx.fillStyle = '#e0f0f8';
    ctx.beginPath();
    ctx.moveTo(ox, GROUND_Y);
    ctx.lineTo(ox + obs.w / 2, GROUND_Y - obs.h);
    ctx.lineTo(ox + obs.w, GROUND_Y);
    ctx.closePath();
    ctx.fill();
    // Shading
    ctx.fillStyle = '#c8dce8';
    ctx.beginPath();
    ctx.moveTo(ox + obs.w * 0.5, GROUND_Y - obs.h);
    ctx.lineTo(ox + obs.w, GROUND_Y);
    ctx.lineTo(ox + obs.w * 0.5, GROUND_Y);
    ctx.closePath();
    ctx.fill();
    // Snow sparkles
    px(ox + obs.w * 0.35, GROUND_Y - obs.h * 0.6, 3, 3, '#fff');
  }
}

function drawIceWall(x) {
  // Full-screen iceberg — solid ice fills the entire screen from x rightward,
  // full height. The hole is cut into the front face only.
  const holeBot = 100;
  const wallFace = 60;
  const fillW = W - x + 10;

  if (fillW <= 0) return;

  // 1) Solid ice filling entire screen height from x to right edge
  px(x, 0, fillW, H, '#90c8d8');

  // Darker back layer for depth
  if (fillW > wallFace) {
    px(x + wallFace, 0, fillW - wallFace, H, '#82bace');
    // Texture lines on back
    for (let ty = 30; ty < H; ty += 60) {
      const tw = Math.min(80, fillW - wallFace - 20);
      if (tw > 0) px(x + wallFace + 20, ty, tw, 2, '#70a8b8');
    }
    // Sparkles on back
    for (let ty = 50; ty < H; ty += 90) {
      px(x + wallFace + 40, ty, 3, 3, '#d0f0ff');
    }
  }

  // 2) Cut the hole into the front face — draw ocean through it
  const grad = ctx.createLinearGradient(0, 0, 0, holeBot);
  grad.addColorStop(0, '#0d3b6e');
  grad.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = grad;
  ctx.fillRect(x, 0, wallFace, holeBot);

  // Hole bottom lip
  px(x, holeBot, wallFace, 6, '#70a8b8');
  px(x, holeBot - 3, wallFace, 3, '#aadaea');

  // Front face shading (below hole)
  px(x, holeBot, 6, H - holeBot, '#70a8b8');
  px(x + wallFace - 4, holeBot, 4, H - holeBot, '#78b0c0');

  // Cracks on wall face
  px(x + 20, holeBot + 30, 2, 60, '#78b0c0');
  px(x + 40, holeBot + 10, 2, 40, '#78b0c0');
  px(x + 15, holeBot + 150, 2, 45, '#78b0c0');
  px(x + 35, holeBot + 50, 3, 3, '#d0f0ff');

  // 3) Light rays shining down through the hole
  ctx.save();
  const lightAlpha = 0.12 + Math.sin(frameCount * 0.05) * 0.05;
  ctx.fillStyle = `rgba(255,255,200,${lightAlpha})`;
  ctx.beginPath();
  ctx.moveTo(x, 0);
  ctx.lineTo(x + wallFace, 0);
  ctx.lineTo(x + wallFace + 80, holeBot + 120);
  ctx.lineTo(x - 80, holeBot + 120);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = `rgba(255,255,220,${lightAlpha * 0.8})`;
  ctx.beginPath();
  ctx.moveTo(x + 10, 0);
  ctx.lineTo(x + wallFace - 10, 0);
  ctx.lineTo(x + wallFace + 20, holeBot + 50);
  ctx.lineTo(x - 20, holeBot + 50);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function playJump() {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(250, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, ac.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + 0.18);
  } catch(e) {}
}

function playSplash() {
  try {
    const ac = getAudio();
    // White noise burst for splash
    const bufSize = ac.sampleRate * 0.15;
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 800;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.2, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(); src.stop(ac.currentTime + 0.2);
  } catch(e) {}
}

// ── Collision detection ───────────────────────────────────────────────────────
// Point-in-triangle test
function pointInTriangle(px, py, x1, y1, x2, y2, x3, y3) {
  const d1 = (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
  const d2 = (px - x3) * (y2 - y3) - (x2 - x3) * (py - y3);
  const d3 = (px - x1) * (y3 - y1) - (x3 - x1) * (py - y1);
  const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(hasNeg && hasPos);
}

// Check if any corner of the penguin hitbox is inside a spike triangle
function hitSpike(px1, py1, px2, py2, triX1, triY1, triX2, triY2, triX3, triY3) {
  // Test all 4 corners of penguin hitbox
  if (pointInTriangle(px1, py1, triX1, triY1, triX2, triY2, triX3, triY3)) return true;
  if (pointInTriangle(px2, py1, triX1, triY1, triX2, triY2, triX3, triY3)) return true;
  if (pointInTriangle(px1, py2, triX1, triY1, triX2, triY2, triX3, triY3)) return true;
  if (pointInTriangle(px2, py2, triX1, triY1, triX2, triY2, triX3, triY3)) return true;
  // Test center too for narrow spikes
  const cx = (px1 + px2) / 2, cy = (py1 + py2) / 2;
  if (pointInTriangle(cx, cy, triX1, triY1, triX2, triY2, triX3, triY3)) return true;
  return false;
}

function checkCollision() {
  const px1 = penguin.x + 6,  py1 = penguin.y + 6;
  const px2 = penguin.x + PENGUIN_W - 6, py2 = penguin.y + PENGUIN_H - 6;

  // World bounds (disable top boundary when ice wall is on screen so penguin can escape)
  const wallOnScreen = pipes.some(p => p.isWall);
  if (!wallOnScreen && py1 < 0) return true;
  if (py2 > H) return true;

  for (const p of pipes) {
    // Ice wall collision (hole at top 20-100px)
    if (p.isWall) {
      // Collide with the leading edge of the wall only
      // The penguin dies if the wall's front edge reaches it and it's not above the hole
      if (p.x <= px2 && p.x + 8 >= px1) {
        if (py2 > 100) return true; // smacked into the wall face
      }
      continue;
    }

    const ox = p.x, ox2 = p.x + OBS_W;

    // Main body collision (rectangle vs rectangle)
    if (!(px2 < ox || px1 > ox2)) {
      if (py1 < p.topH - 10) return true; // iceberg body (above spike zone)
      if (py2 > p.botY + 10) return true;  // rock body (below spike zone)
    }

    // Ice spike collision (stalactites hanging down)
    for (const s of p.iceSpikes) {
      const sx = p.x + s.offset * OBS_W;
      const baseY = p.topH - 10;
      const tipY  = baseY + s.height;
      if (hitSpike(px1, py1, px2, py2,
          sx - s.width/2, baseY,
          sx + s.width/2, baseY,
          sx, tipY)) return true;
    }

    // Rock spike collision (stalagmites pointing up)
    for (const s of p.rockSpikes) {
      const sx = p.x + s.offset * OBS_W;
      const baseY = p.botY + 10;
      const tipY  = baseY - s.height;
      if (hitSpike(px1, py1, px2, py2,
          sx - s.width/2, baseY,
          sx + s.width/2, baseY,
          sx, tipY)) return true;
    }
  }

  // Seal collision (rectangle vs rectangle with bob)
  for (const s of seals) {
    const sy = s.y + (s.bob || 0);
    const sx1 = s.x - 8, sx2 = s.x + SEAL_W + 12; // include snout + tail
    const sy1 = sy, sy2 = sy + 28;
    if (!(px2 < sx1 || px1 > sx2 || py2 < sy1 || py1 > sy2)) return true;
  }

  return false;
}

function checkWalkCollision() {
  if (!landSection) return false;
  const px1 = penguin.x + 6, py1 = penguin.y + 6;
  const px2 = penguin.x + PENGUIN_W - 6, py2 = penguin.y + PENGUIN_H - 6;
  const offX = landSection.scrollX;

  // Check each obstacle
  for (const obs of landSection.obstacles) {
    const ox = obs.x - offX;
    if (ox > W + 50 || ox + (obs.w || 0) < -50) continue;

    if (obs.type === 'cube') {
      // Solid rectangle collision
      const cubeLeft = ox, cubeRight = ox + obs.w;
      const cubeTop = obs.y, cubeBot = obs.y + obs.h;
      if (!(px2 < cubeLeft || px1 > cubeRight || py2 < cubeTop || py1 > cubeBot)) {
        // Determine if landing on top
        if (penguin.vy >= 0 && py2 - penguin.vy <= cubeTop + 4) {
          penguin.y = cubeTop - PENGUIN_H + 6;
          penguin.vy = 0;
          penguin.onGround = true;
          return false; // not death, landed on it
        }
        return true; // hit side or bottom
      }
    } else if (obs.type === 'gap') {
      // If penguin overlaps gap and is at ground level
      if (px2 > ox && px1 < ox + obs.w && py2 >= GROUND_Y - 2) {
        return true; // fell in
      }
    } else if (obs.type === 'mound') {
      // Triangle collision - approximate with point-in-triangle for penguin bottom center
      const mx = ox + obs.w / 2, my = GROUND_Y - obs.h;
      const bcx = (px1 + px2) / 2;
      if (pointInTriangle(bcx, py2, ox, GROUND_Y, mx, my, ox + obs.w, GROUND_Y)) {
        // Landing on top of mound
        if (penguin.vy >= 0) {
          // Calculate slope height at penguin's x
          const rel = (bcx - ox) / obs.w;
          const surfY = GROUND_Y - obs.h * (rel < 0.5 ? rel * 2 : (1 - rel) * 2);
          penguin.y = surfY - PENGUIN_H + 6;
          penguin.vy = 0;
          penguin.onGround = true;
          return false;
        }
        return true;
      }
    }
  }

  // Off the bottom of screen
  if (py2 > H) return true;

  return false;
}

// ── Input ─────────────────────────────────────────────────────────────────────
function handleInput() {
  getAudio(); // wake audio context
  if (state === 'idle') {
    state = 'playing';
    initGame();
  } else if (state === 'playing') {
    if (mode === 'swim') {
      penguin.vy = FLAP_VEL;
      playFlap();
    } else if (mode === 'walk') {
      if (penguin.onGround) {
        penguin.vy = WALK_JUMP_VEL;
        penguin.onGround = false;
        playJump();
      }
    }
  } else if (state === 'dead' && deathTimer > 60) {
    state = 'playing';
    initGame();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); handleInput(); }
});
canvas.addEventListener('click', e => { e.preventDefault(); handleInput(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });

// ── Main game loop ────────────────────────────────────────────────────────────
function gameLoop() {
  requestAnimationFrame(gameLoop);
  frameCount++;

  if (state === 'playing' && mode === 'swim') {
    bgOffset += PIPE_SPEED;
    swimFrames++;
  } else if (state === 'idle') {
    bgOffset += 0.5;
  }

  // ── SWIM MODE ────────────────────────────────────────────────────────────
  if (mode === 'swim' || mode === 'transition_up') {
    drawBackground(bgOffset);

    if (state === 'playing' && mode === 'swim') {
      // Check if it's time for a walk section
      const wallPending = pipes.some(p => p.isWall);
      // Stop spawning obstacles early to leave a clear gap before the wall
      const stopSpawning = swimFrames >= SWIM_BEFORE_WALK - 40;
      if (swimFrames >= SWIM_BEFORE_WALK && !wallPending) {
        // Only spawn wall once all normal pipes have cleared past half screen
        const lastPipeX = pipes.reduce((mx, p) => Math.max(mx, p.x + OBS_W), 0);
        if (lastPipeX < W / 2) {
          pipes.push({
            x: W + W / 2, topH: 100, botY: 100, botH: H - 100, gap: 0,
            passed: false, isWall: true,
            iceSpikes: [], rockSpikes: []
          });
          nextPipeIn = 999;
        }
      }

      if (!stopSpawning && !wallPending) {
        nextPipeIn--;
        if (nextPipeIn <= 0) spawnObstacle();
      }

      // Physics
      penguin.vy += GRAVITY;
      penguin.y  += penguin.vy;
      penguin.angle = Math.max(-0.5, Math.min(1.0, penguin.vy * 0.07));
      penguin.wobble = Math.sin(frameCount * 0.25) * 1.5;

      // Move and cull pipes
      pipes = pipes.filter(p => p.x + 70 > 0 || p.isWall);
      for (const p of pipes) {
        p.x -= PIPE_SPEED;
        if (!p.passed && p.x + 70 < PENGUIN_X) {
          p.passed = true;
        }
        // Check if penguin reaches the wall hole
        if (p.isWall && p.x <= PENGUIN_X + PENGUIN_W && penguin.y + PENGUIN_H < 100) {
          mode = 'transition_up';
          transTimer = 0;
          pipes = pipes.filter(pp => !pp.isWall);
        }
      }

      // Move and cull fish
      fish = fish.filter(f => f.x + 30 > 0 && !f.eaten);
      for (const f of fish) {
        f.x -= PIPE_SPEED;
        f.anim++;
        if (!f.eaten &&
            penguin.x + PENGUIN_W > f.x - 14 && penguin.x < f.x + 6 &&
            penguin.y + PENGUIN_H > f.y - 8  && penguin.y < f.y + 4) {
          f.eaten = true;
          score += 5;
          playMunch();
        }
      }

      // Move and cull seals
      seals = seals.filter(s => s.x + SEAL_W + 10 > 0);
      for (const s of seals) {
        s.x -= PIPE_SPEED;
        s.anim++;
        s.bob = Math.sin(s.anim * 0.04) * 15;
        const sealCenterY = s.y + s.bob + 14;
        const penguinCenterY = penguin.y + PENGUIN_H / 2;
        const dy = penguinCenterY - sealCenterY;
        s.y += dy * 0.015;
        if (s.x > PENGUIN_X + 40) s.x -= 0.4;
        // Snap angle: up, down, or straight based on penguin position
        const threshold = 30;
        let targetAngle = 0;
        if (dy > threshold) targetAngle = -0.35;       // penguin below -> angle down
        else if (dy < -threshold) targetAngle = 0.35; // penguin above -> angle up
        s.angle = (s.angle || 0) + (targetAngle - (s.angle || 0)) * 0.08;
      }

      // Spawn squids
      if (Math.random() < 0.003) {
        const sqX = 80 + Math.random() * (W - 160);
        const minY = H * 0.55;
        squids.push({ x: sqX, y: H + 30, minY: minY + Math.random() * (H * 0.2), anim: 0, eaten: false });
      }
      squids = squids.filter(s => !s.eaten && s.y > -40);
      for (const s of squids) {
        s.anim++;
        if (s.y > s.minY) s.y -= 0.7; else s.y += 0.4;
        s.x -= PIPE_SPEED * 0.3;
        if (!s.eaten &&
            penguin.x + PENGUIN_W > s.x - 10 && penguin.x < s.x + 12 &&
            penguin.y + PENGUIN_H > s.y - 10 && penguin.y < s.y + 28) {
          s.eaten = true;
          score += 15;
          playMunch();
        }
      }

      // Score
      score += 0.055;
      document.getElementById('score-display').textContent = Math.floor(score);

      // Collision
      if (checkCollision()) {
        state = 'dead';
        deathTimer = 0;
        if (score > bestScore) bestScore = score;
        document.getElementById('best-display').textContent = 'BEST: ' + Math.floor(bestScore);
        playDead();
      }
    }

    // Transition up animation
    if (mode === 'transition_up') {
      transTimer++;
      if (transTimer < 20) {
        // Phase 1: swim up quickly
        penguin.y -= 5;
        penguin.angle = -0.8;
      } else if (transTimer < 45) {
        // Phase 2: leap out of water with an arc
        penguin.y -= 6;
        penguin.x += 1.5;
        penguin.angle = -1.0 + (transTimer - 20) * 0.06;
      } else if (transTimer < 65) {
        // Phase 3: arc down onto ice
        penguin.y += 2;
        penguin.x += 0.5;
        penguin.angle = (transTimer - 45) * 0.04;
      } else if (transTimer < 80) {
        // Phase 4: screen brightens, fade to walk
        const fade = (transTimer - 65) / 15;
        ctx.fillStyle = `rgba(255,255,255,${fade * 0.8})`;
        ctx.fillRect(0, 0, W, H);
      } else {
        // Switch to walk mode
        mode = 'walk';
        landSection = generateWalkSection();
        // Ensure no obstacles near the start
        landSection.obstacles = landSection.obstacles.filter(o => o.x > 350);
        penguin.x = PENGUIN_X;
        penguin.y = GROUND_Y - PENGUIN_H + 6;
        penguin.vy = 0;
        penguin.onGround = true;
        pipes = []; fish = []; seals = []; squids = [];
        playSplash();
      }
      // Draw brightening light from above
      const alpha = Math.min(1, transTimer / 30);
      ctx.fillStyle = `rgba(255,255,230,${alpha * 0.4})`;
      ctx.fillRect(0, 0, W, H * 0.4);
    }

    if (state === 'dead') {
      deathTimer++;
      penguin.vy = Math.min(penguin.vy + GRAVITY, 8);
      penguin.y  = Math.min(penguin.y + penguin.vy, H - PENGUIN_H);
      penguin.angle = 1.4;
    }

    // Draw swim entities
    for (const p of pipes) {
      if (p.isWall) {
        drawIceWall(p.x);
      } else {
        drawIceberg(p.x, p.topH, p.iceSpikes);
        drawRock(p.x, p.botY, p.botH, p.rockSpikes);
      }
    }
    for (const s of seals) drawSeal(s.x, s.y + (s.bob || 0), s.anim, s.angle || 0);
    for (const s of squids) { if (!s.eaten) drawSquid(s.x, s.y, s.anim); }
    for (const f of fish) drawFish(f.x, f.y, f.anim);

    if (state !== 'idle') {
      drawPenguin(penguin.x, penguin.y, penguin.angle, penguin.wobble);
    }

  // ── WALK MODE ────────────────────────────────────────────────────────────
  } else if (mode === 'walk' || mode === 'transition_down') {
    drawWalkBackground();

    if (state === 'playing' && mode === 'walk' && landSection) {
      // Scroll the section
      landSection.scrollX += PIPE_SPEED;
      bgOffset += PIPE_SPEED * 0.3;

      // Walk physics
      penguin.vy += WALK_GRAVITY;
      penguin.y += penguin.vy;
      penguin.onGround = false;

      // Ground collision
      if (penguin.y + PENGUIN_H - 6 >= GROUND_Y) {
        // Check if over a gap
        let overGap = false;
        for (const obs of landSection.obstacles) {
          if (obs.type === 'gap') {
            const ox = obs.x - landSection.scrollX;
            if (penguin.x + PENGUIN_W - 6 > ox + 4 && penguin.x + 6 < ox + obs.w - 4) {
              overGap = true;
              break;
            }
          }
        }
        if (!overGap) {
          penguin.y = GROUND_Y - PENGUIN_H + 6;
          penguin.vy = 0;
          penguin.onGround = true;
        }
      }

      // Obstacle collision
      if (checkWalkCollision()) {
        state = 'dead';
        deathTimer = 0;
        if (score > bestScore) bestScore = score;
        document.getElementById('best-display').textContent = 'BEST: ' + Math.floor(bestScore);
        playDead();
      }

      // Check if reached end of section (exit hole)
      if (landSection.scrollX >= landSection.totalWidth - W / 2) {
        mode = 'transition_down';
        transTimer = 0;
        playSplash();
      }

      // Score
      score += 0.055;
      document.getElementById('score-display').textContent = Math.floor(score);
    }

    // Transition down animation
    if (mode === 'transition_down') {
      transTimer++;
      if (transTimer < 30) {
        // Penguin walks toward hole then dives
        penguin.x += 2;
        if (transTimer > 15) {
          penguin.y += 5;
        }
      } else {
        // Back to swim
        mode = 'swim';
        swimFrames = 0;
        penguin.x = PENGUIN_X;
        penguin.y = H / 2;
        penguin.vy = 0;
        penguin.angle = 0;
        landSection = null;
        nextPipeIn = 60;
      }
    }

    if (state === 'dead') {
      deathTimer++;
      penguin.vy = Math.min(penguin.vy + WALK_GRAVITY, 8);
      penguin.y  = Math.min(penguin.y + penguin.vy, H);
    }

    // Draw ground (with gaps cut out)
    if (landSection) {
      drawIceGround(landSection.scrollX);

      // Draw gaps over the ground
      for (const obs of landSection.obstacles) {
        if (obs.type === 'gap') drawLandObstacle(obs, landSection.scrollX);
      }

      // Draw other obstacles
      for (const obs of landSection.obstacles) {
        if (obs.type !== 'gap') drawLandObstacle(obs, landSection.scrollX);
      }

      // Draw exit hole and fishing penguin
      const holeScreenX = landSection.holeX - landSection.scrollX;
      const npcScreenX = landSection.npcX - landSection.scrollX;
      if (holeScreenX > -50 && holeScreenX < W + 50) {
        drawExitHole(holeScreenX);
      }
      if (npcScreenX > -50 && npcScreenX < W + 50) {
        drawFishingPenguin(npcScreenX + 50, GROUND_Y - 16);
      }
    }

    // Draw walking penguin
    if (state !== 'idle') {
      drawWalkPenguin(penguin.x, penguin.y, penguin.onGround);
    }
  }

  // Overlays (both modes)
  if (state === 'idle') drawIdle();
  if (state === 'dead') drawDead();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
initGame();
state = 'idle';
document.getElementById('score-display').textContent = '';
document.getElementById('best-display').textContent  = '';
gameLoop();
</script>
